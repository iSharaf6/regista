# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# `azd up` provisions Foundry + Container Apps + Event Hubs + App Insights and deploys Regista.
name: regista
metadata:
  template: regista@0.1.0
services:
  regista:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      # build in Azure Container Registry, so `azd up` needs no local Docker
      remoteBuild: true
infra:
  provider: bicep
  path: infra

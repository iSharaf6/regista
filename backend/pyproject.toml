[project]
name = "regista"
version = "0.1.0"
description = "Regista - a multi-agent match director that turns synthetic football events into explainable, personalised match intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "agent-framework-core>=1.22",
    "agent-framework-foundry>=1.15",
    "agent-framework-openai>=1.0",
    "azure-identity>=1.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=1.26",
    "mcp>=1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
azure = [
    "azure-eventhub>=5.12",
    "azure-monitor-opentelemetry>=1.6",
    "azure-ai-contentsafety>=1.0",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
regista = "regista.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regista"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
